Description: 'S3 static website configuration template'
Resources:
  Bucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: 'surbhi-1st-cloud-bucket'
      WebsiteConfiguration:
        IndexDocument: index.html
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicPolicy: false
        RestrictPublicBuckets: false
  BucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref Bucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Action: 's3:GetObject'
            Effect: Allow
            Principal: '*'
            Resource: 'arn:aws:s3:::surbhi-1st-cloud-bucket/*'
